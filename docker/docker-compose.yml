services:
  # NIGHTGATE as standalone service
  # See docs/docker.md for schema-upgrade and proving-mode notes.
  nightgate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/odatano/nightgate:${NIGHTGATE_IMAGE_TAG:-0.40.0}
    container_name: odatano-nightgate
    # Loopback only by default: basic auth is plain text without TLS, so put a
    # TLS reverse proxy in front. NIGHTGATE_BIND_ADDRESS=0.0.0.0 publishes it.
    ports:
      - "${NIGHTGATE_BIND_ADDRESS:-127.0.0.1}:4004:4004"
    environment:
      # Required: encrypts wallet viewing/seed keys at rest (openssl rand -hex 32).
      # Not a compose `:?` variable: compose would demand it even for
      # `up proof-server`; the entrypoint refuses to start without it instead.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      # Optional: PostgreSQL instead of the SQLite file under /data.
      # With `--profile postgres` the bundled service below matches this URL.
      NIGHTGATE_DB_URL: "${NIGHTGATE_DB_URL:-}"
      # Basic-auth credentials for the OData services (NIGHTGATE_AUTH=dummy
      # serves unauthenticated, local testing only).
      NIGHTGATE_HTTP_USER: "${NIGHTGATE_HTTP_USER:-nightgate}"
      NIGHTGATE_HTTP_PASSWORD: "${NIGHTGATE_HTTP_PASSWORD:-}"   # refused by cds-config.mjs when empty
      NIGHTGATE_NETWORK: "${NIGHTGATE_NETWORK:-preprod}"
      NIGHTGATE_CRAWLER_ENABLED: "${NIGHTGATE_CRAWLER_ENABLED:-false}"
      # First height to index while the index is empty (unset = genesis) and the
      # catch-up rate cap that keeps the crawler off the submission side's CPU.
      NIGHTGATE_CRAWLER_START_HEIGHT: "${NIGHTGATE_CRAWLER_START_HEIGHT:-}"
      NIGHTGATE_CRAWLER_MAX_BPS: "${NIGHTGATE_CRAWLER_MAX_BPS:-}"
      # Node and indexer of the network. Preprod and mainnet need their own, or hosted ones (docs/self-hosted.md).
      NIGHTGATE_NODE_URL: "${NIGHTGATE_NODE_URL:-}"
      NIGHTGATE_INDEXER_HTTP_URL: "${NIGHTGATE_INDEXER_HTTP_URL:-}"
      NIGHTGATE_INDEXER_WS_URL: "${NIGHTGATE_INDEXER_WS_URL:-}"
      # Optional: switches proving from in-process wasm to a proof server,
      # e.g. http://proof-server:6300 with the service below.
      NIGHTGATE_PROOF_SERVER_URL: "${NIGHTGATE_PROOF_SERVER_URL:-}"
      # HTTP timeout of one proof request in server mode (default 300000 =
      # 5 min). Raise it with the proof server's job TTL below for proofs
      # past 5 min; the SDK re-requests a timed-out proof up to three times.
      NIGHTGATE_PROOF_TIMEOUT_MS: "${NIGHTGATE_PROOF_TIMEOUT_MS:-}"
      # Roles for the single basic-auth operator, none by default. `admin`
      # opens the admin service (signing-key export, session invalidation, job queue).
      NIGHTGATE_HTTP_ROLES: "${NIGHTGATE_HTTP_ROLES:-}"
    volumes:
      - nightgate-data:/data
    restart: unless-stopped
    # A graceful stop flushes wallet state and closes sessions; with three
    # warm facades that takes longer than docker's default 10 s.
    stop_grace_period: 90s
    # node is PID 1 and reaps no orphans (a killed health check leaves a
    # zombie each time); tini as PID 1 reaps them and still forwards SIGTERM.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # wasm proving + wallet catch-up are memory-hungry; the image's
          # default heap is 8 GB (NODE_OPTIONS), keep the limit above it.
          cpus: "4.0"
          memory: 10G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Midnight Node, a local dev chain for development only.
  # Preprod and mainnet need their own node, or a hosted one with its token in the URL.
  node:
    image: midnightntwrk/midnight-node:0.20.0
    container_name: odatano-night-node
    ports:
      - "9944:9944" # Substrate RPC
      - "30333:30333" # P2P
    environment:
      # Local dev preset. A preprod node also needs Cardano db-sync and Postgres, else it fails config validation.
      # A hosted node with its token in the URL (docs/self-hosted.md) spares that.
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    volumes:
      - node-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Midnight indexer (standalone): one container, embedded SQLite, indexes from the
  # Substrate node in INDEXER_UPSTREAM_NODE_URL. A sync from genesis takes days on preprod.
  # NIGHTGATE uses it with NIGHTGATE_INDEXER_HTTP_URL=http://localhost:8088/api/v4/graphql.
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: odatano-night-indexer
    ports:
      - "8088:8088"
    environment:
      # The wallet-SDK queries via this network ID. Has to match NIGHTGATE's
      # configured network (cds.requires.nightgate.network).
      APP__APPLICATION__NETWORK_ID: "${NIGHTGATE_NETWORK:-preprod}"
      # Upstream Substrate node of the same network, set in .env: your own preprod node, or a
      # hosted one with its token in the URL (wss://rpc.midnight-preprod.blockfrost.io?project_id=...).
      # The `node` service above is a local dev chain, not preprod. Empty = the indexer refuses to start.
      APP__INFRA__NODE__URL: "${INDEXER_UPSTREAM_NODE_URL:-}"
      APP__INFRA__SPO_NODE__URL: "${INDEXER_UPSTREAM_NODE_URL:-}"
      # Hex-encoded 32-byte secret that encrypts stored data. Set INDEXER_SECRET for production and never commit it.
      # It needs at least one a-f character, or the indexer reads it as a number and crash-loops.
      APP__INFRA__SECRET: "${INDEXER_SECRET:-deadbeefcafebabedeadbeefcafebabedeadbeefcafebabedeadbeefcafebabe}"
      # SPO/Blockfrost integration off for vanilla wallet-SDK usage. Required
      # placeholder per the indexer's config schema.
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "dummy-not-using-spo"
      RUST_LOG: "indexer_standalone=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info"
      # The default concurrency of 1 indexes serially and takes weeks to catch up. These values speed up the historical sync.
      # If the upstream node rate-limits, lower CONCURRENCY_LIMIT.
      APP__APPLICATION__CONCURRENCY_LIMIT: "16"
      APP__APPLICATION__BLOCKS_BUFFER: "100"
      APP__APPLICATION__TRANSACTION_BATCH_SIZE: "200"
    volumes:
      - indexer-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # 8 CPU / 8G. NOTE: the catch-up bottleneck is NOT cpu/mem/disk; it is
          # serial latency-bound block fetching from the remote RPC (~132ms RTT,
          # several calls/block → ~0.5-1 blk/s). These limits don't change that.
          cpus: "8.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G

  # Midnight Proof Server. Makes the ZK proofs for contract calls and deploys. The crawler does not need it.
  # The first run downloads about 500 MB of ZK parameters. The named volume keeps them across restarts.
  # NIGHTGATE_PROOF_NETWORK picks the network, default preprod. Use testnet for the local node.
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: odatano-night-proof-server
    command: ["midnight-proof-server", "--network", "${NIGHTGATE_PROOF_NETWORK:-preprod}"]
    environment:
      # Per-job TTL of the proving pool, seconds (default 600). A finished
      # job past it answers 5xx; keep it above NIGHTGATE_PROOF_TIMEOUT_MS.
      MIDNIGHT_PROOF_SERVER_JOB_TIMEOUT: "${MIDNIGHT_PROOF_SERVER_JOB_TIMEOUT:-600}"
    ports:
      # Loopback only. The proof server has no auth, and proving requests carry private witness data.
      # Other compose services reach it at http://proof-server:6300.
      - "127.0.0.1:6300:6300"
    volumes:
      - proof-server-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          # Proving holds the constraint system in memory; the 38.5 MB comparison prover needs this.
          memory: 12G
        reservations:
          cpus: "0.5"
          memory: 1G

  # PostgreSQL for NIGHTGATE: Start with `--profile postgres` and set
  # NIGHTGATE_DB_URL=postgres://nightgate:${NIGHTGATE_PG_PASSWORD}@nightgate-postgres:5432/nightgate
  # on the nightgate service.
  nightgate-postgres:
    image: postgres:16-alpine
    container_name: nightgate-postgres
    profiles: ["postgres"]
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min", "-c", "wal_buffers=64MB"]
    environment:
      POSTGRES_USER: nightgate
      POSTGRES_DB: nightgate
      POSTGRES_PASSWORD: "${NIGHTGATE_PG_PASSWORD:-}"
    volumes:
      - nightgate-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightgate -d nightgate"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  nightgate-data:
  nightgate-pg-data:
  node-data:
  proof-server-data:
  indexer-data:
