services:
  # NIGHTGATE itself, standalone: pull (or build) the image, set two secrets,
  # and the full attestation server (four OData services, submission pipeline,
  # in-process wasm proving) runs on :4004. No other service below is
  # required: proving defaults to in-process wasm and the public preprod
  # endpoints serve node/indexer. Bring up proof-server and point
  # NIGHTGATE_PROOF_SERVER_URL at it to offload proving.
  #
  # Quickstart (from the repo root):
  #   ENCRYPTION_KEY=$(openssl rand -hex 32) \
  #   NIGHTGATE_HTTP_PASSWORD=change-me \
  #   docker compose -f docker/docker-compose.yml up -d nightgate
  # See docs/docker.md for schema-upgrade and proving-mode notes.
  nightgate:
    build:
      context: ..
      dockerfile: Dockerfile
    # Published by .github/workflows/release.yml on every v* tag; compose
    # pulls this and only builds locally when the image is unavailable.
    # NIGHTGATE_IMAGE_TAG overrides; keep the default in lockstep with
    # package.json on every release.
    image: ghcr.io/odatano/nightgate:${NIGHTGATE_IMAGE_TAG:-0.21.6}
    container_name: odatano-nightgate
    ports:
      - "4004:4004"
    environment:
      # Required: encrypts wallet viewing/seed keys at rest (openssl rand -hex 32).
      # Not a compose `:?` variable: compose would demand it even for
      # `up proof-server`; the entrypoint refuses to start without it instead.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      # Optional (0.21.1): PostgreSQL instead of the SQLite file under /data.
      # With `--profile postgres` the bundled service below matches this URL.
      NIGHTGATE_DB_URL: "${NIGHTGATE_DB_URL:-}"
      # Basic-auth credentials for the OData services (NIGHTGATE_AUTH=dummy
      # serves unauthenticated, local testing only).
      NIGHTGATE_HTTP_USER: "${NIGHTGATE_HTTP_USER:-nightgate}"
      NIGHTGATE_HTTP_PASSWORD: "${NIGHTGATE_HTTP_PASSWORD:-}"   # refused by cds-config.mjs when empty
      NIGHTGATE_NETWORK: "${NIGHTGATE_NETWORK:-preprod}"
      NIGHTGATE_CRAWLER_ENABLED: "${NIGHTGATE_CRAWLER_ENABLED:-false}"
      # Optional overrides (empty = built-in per-network defaults):
      NIGHTGATE_NODE_URL: "${NIGHTGATE_NODE_URL:-}"
      NIGHTGATE_INDEXER_HTTP_URL: "${NIGHTGATE_INDEXER_HTTP_URL:-}"
      NIGHTGATE_INDEXER_WS_URL: "${NIGHTGATE_INDEXER_WS_URL:-}"
      # Optional: switches proving from in-process wasm to a proof server,
      # e.g. http://proof-server:6300 with the service below.
      NIGHTGATE_PROOF_SERVER_URL: "${NIGHTGATE_PROOF_SERVER_URL:-}"
      # Plain status routes (/nightgate/metrics|health|ready). They sit outside
      # CAP authentication, so they stay unmounted unless one of these is set.
      # Leave both empty and the entrypoint still generates an internal token
      # for the container's own healthcheck; set a token here to scrape from
      # outside, or NIGHTGATE_STATUS_ROUTES=public to serve them anonymously.
      NIGHTGATE_STATUS_TOKEN: "${NIGHTGATE_STATUS_TOKEN:-}"
      NIGHTGATE_STATUS_ROUTES: "${NIGHTGATE_STATUS_ROUTES:-}"
      # The healthcheck probes <prefix>/ready, so a custom prefix has to reach
      # the container or the probe would look in the wrong place.
      NIGHTGATE_STATUS_ROUTES_PREFIX: "${NIGHTGATE_STATUS_ROUTES_PREFIX:-}"
      # Roles for the single basic-auth operator. Defaults to admin, which the
      # admin service (session invalidation, job queue) requires.
      NIGHTGATE_HTTP_ROLES: "${NIGHTGATE_HTTP_ROLES:-admin}"
    volumes:
      - nightgate-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # wasm proving + wallet catch-up are memory-hungry; the image's
          # default heap is 8 GB (NODE_OPTIONS), keep the limit above it.
          cpus: "4.0"
          memory: 10G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Midnight Node, local standalone node for undeployed/local development only.
  # For local testnet development only. Preprod uses the public RPC (default, no Docker needed).
  node:
    image: midnightntwrk/midnight-node:0.20.0
    container_name: odatano-night-node
    ports:
      - "9944:9944" # Substrate RPC (used by ODATANO-NIGHT crawler)
      - "30333:30333" # P2P
    environment:
      # Local standalone preset; keep this for undeployed/local testing.
      # NOTE: CFG_PRESET=preprod does NOT work standalone — a preprod node is a
      # Cardano partner chain and requires a Cardano db-sync + Postgres
      # (main-chain follower), else it fails config validation
      # ("db_sync_postgres_connection_string must be defined"). That Cardano
      # dependency is the heavy part; use the public preprod RPC instead.
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    volumes:
      - node-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Midnight Indexer (standalone), self-hosted alternative to the public
  # `indexer.preprod.midnight.network` endpoint. The hosted service has been
  # observed returning 503s during peak hours — running our own keeps the
  # wallet-SDK's GraphQL subscriptions reliable.
  #
  # Standalone mode = single container, embedded SQLite. No Postgres or NATS.
  # Indexes ON-DEMAND from a Substrate node over WebSocket. We point at the
  # public preprod RPC (`wss://rpc.preprod.midnight.network/`) so we don't
  # also need to host a 30-80 GB Substrate full node. If the public RPC ever
  # gets unreliable, flip APP__INFRA__NODE__URL to a local node container.
  #
  # First-time sync from genesis: estimated 1-3 hours for the indexer to walk
  # the chain at ~830k blocks (Preprod height as of 2026-05-18). SQLite grows
  # to a few GB. Subsequent restarts are incremental and fast.
  #
  # Flipping NIGHTGATE to use it: set NIGHTGATE_INDEXER_HTTP_URL and
  # NIGHTGATE_INDEXER_WS_URL in your .env to http://localhost:8088 /
  # ws://localhost:8088/api/v4/graphql/ws. See .env.example.
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: odatano-night-indexer
    ports:
      - "8088:8088"
    environment:
      # The wallet-SDK queries via this network ID. Has to match NIGHTGATE's
      # configured network (cds.requires.nightgate.network).
      APP__APPLICATION__NETWORK_ID: "${NIGHTGATE_NETWORK:-preprod}"
      # Upstream Substrate node. Default = hosted preprod RPC. To run fully
      # autark, change to ws://node:9944 and bring up the `node` service with
      # CFG_PRESET=preprod (not the current `dev` preset).
      APP__INFRA__NODE__URL: "${INDEXER_UPSTREAM_NODE_URL:-wss://rpc.preprod.midnight.network/}"
      APP__INFRA__SPO_NODE__URL: "${INDEXER_UPSTREAM_NODE_URL:-wss://rpc.preprod.midnight.network/}"
      # Required: hex-encoded 32-byte secret used to encrypt stored data.
      # Must contain at least one a-f character or the indexer's config parser
      # mis-types an all-numeric string as an unsigned int and the container
      # crash-loops with "invalid type: found unsigned int". For local dev a
      # fixed placeholder is fine; for production set INDEXER_SECRET in your
      # environment. NEVER commit a real secret.
      APP__INFRA__SECRET: "${INDEXER_SECRET:-deadbeefcafebabedeadbeefcafebabedeadbeefcafebabedeadbeefcafebabe}"
      # SPO/Blockfrost integration off for vanilla wallet-SDK usage. Required
      # placeholder per the indexer's config schema.
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "dummy-not-using-spo"
      RUST_LOG: "indexer_standalone=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info"
      # Catch-up tuning: the default concurrency_limit=1 indexes serially
      # (~0.4 blk/s, weeks to catch up). Parallelize block fetch/processing and
      # widen the buffers to speed the historical sync. If the upstream public
      # RPC rate-limits, dial CONCURRENCY_LIMIT back down.
      APP__APPLICATION__CONCURRENCY_LIMIT: "16"
      APP__APPLICATION__BLOCKS_BUFFER: "100"
      APP__APPLICATION__TRANSACTION_BATCH_SIZE: "200"
    volumes:
      - indexer-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # 8 CPU / 8G. NOTE: the catch-up bottleneck is NOT cpu/mem/disk; it is
          # serial latency-bound block fetching from the remote RPC (~132ms RTT,
          # several calls/block → ~0.5-1 blk/s). These limits don't change that.
          cpus: "8.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G

  # Midnight Proof Server, generates ZK proofs for contract calls/deploys.
  # Required by the submission path (T4). The crawler does NOT need this.
  #
  # First run downloads ~500 MB of ZK parameters; subsequent contract compiles
  # may pull additional circuit params (Circuit 24 ~3 GB has been reported).
  # Persist the params via the named volume so they survive container restarts.
  #
  # Network selection: pass NIGHTGATE_PROOF_NETWORK in your env (defaults to preprod).
  # Set to testnet for local node; mainnet not recommended until forum issue 1190 resolves.
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: odatano-night-proof-server
    command: ["midnight-proof-server", "--network", "${NIGHTGATE_PROOF_NETWORK:-preprod}"]
    ports:
      # Loopback-only: the proof server is unauthenticated and proving
      # requests carry PRIVATE witness data, so it must never listen on a
      # public interface. Other compose services still reach it via the
      # compose network (http://proof-server:6300); override the bind address
      # deliberately if a remote consumer really needs it.
      - "127.0.0.1:6300:6300"
    volumes:
      - proof-server-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          # 4G got the container OOM-killed (exit 137) under the vault's
          # larger circuits and 6G held for ~10 MB provers; the 0.16.0
          # cross-root circuit's prover is 38.5 MB, so give the server
          # headroom for its constraint system.
          memory: 12G
        reservations:
          cpus: "0.5"
          memory: 1G

  # PostgreSQL for NIGHTGATE (0.21.1). Start with `--profile postgres` and set
  # NIGHTGATE_DB_URL=postgres://nightgate:${NIGHTGATE_PG_PASSWORD}@nightgate-postgres:5432/nightgate
  # on the nightgate service. Migrate an existing SQLite volume with the image's
  # `migrate` mode (docs/docker.md, "PostgreSQL").
  # NIGHTGATE_PG_PASSWORD is not a `:?` required variable: compose interpolates
  # those before profile selection, which would break the SQLite quickstart.
  # An empty password fails inside the container instead (the postgres image
  # refuses to initialise without POSTGRES_PASSWORD).
  nightgate-postgres:
    image: postgres:16-alpine
    container_name: nightgate-postgres
    profiles: ["postgres"]
    # The wallet snapshot table is write-heavy (tens of MB per save): with the
    # image defaults (128 MB shared_buffers, 5 min checkpoints) a checkpoint
    # wrote for minutes and stalled the app's connections. Sized for a host
    # with a few GB to spare; scale shared_buffers with the box.
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min", "-c", "wal_buffers=64MB"]
    environment:
      POSTGRES_USER: nightgate
      POSTGRES_DB: nightgate
      POSTGRES_PASSWORD: "${NIGHTGATE_PG_PASSWORD:-}"
    volumes:
      - nightgate-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightgate -d nightgate"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  nightgate-data:
  nightgate-pg-data:
  node-data:
  proof-server-data:
  indexer-data:
