name: NIGHTGATE Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightgate-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean generated build artifacts
        run: npm run clean

      - name: Build plugin
        run: npm run build

      # The SAME gate set npm prepublishOnly and the tag-release workflow
      # run (lint, typecheck, full suite with coverage, real-artifact vault
      # integration, legacy schema-delta migration, browser bundle + types,
      # packed-tarball invariants). One definition, three consumers.
      - name: Release gates
        env:
          CI: true
          NODE_ENV: test
        run: npm run check:release

      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false

  # The database paths against a REAL PostgreSQL (the hosted dialect): model
  # deploy, BYTEA round trip of Transactions.raw through the BlockProcessor,
  # secondary indexes, SQLSTATE-based lock-contention classification and
  # retry. Everything else runs on SQLite.
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nightgate
          POSTGRES_PASSWORD: nightgate
          POSTGRES_DB: nightgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: PostgreSQL lane
        env:
          NIGHTGATE_PG_URL: postgres://nightgate:nightgate@127.0.0.1:5432/nightgate
        run: npm run integration:postgres