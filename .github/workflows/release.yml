name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Release gates: the SAME checks CI and npm prepublishOnly run. A tag must
  # never publish an image/release that CI would have failed, and a
  # mis-versioned tag must die before anything is pushed.
  check:
    runs-on: ubuntu-latest
    # The PostgreSQL lane is part of the tag gate: a tag must not publish
    # before the database the image ships with has been exercised.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nightgate
          POSTGRES_PASSWORD: nightgate
          POSTGRES_DB: nightgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION#.}
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Release gates (lint, typecheck, tests, integrations, packaging, PostgreSQL)
        env:
          CI: true
          NODE_ENV: test
          NIGHTGATE_PG_URL: postgres://nightgate:nightgate@127.0.0.1:5432/nightgate
        run: npm run check:release:full

  build-and-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Heal the recurring `v.0.14.0` typo (leading dot after the v) and
          # fail fast on anything that is still not a valid image tag, instead
          # of dying later in buildx with "invalid reference format".
          VERSION=${VERSION#.}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF#refs/tags/}' does not yield a valid version (got '$VERSION'); use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Belt-and-braces (the check job already gates on this): never push
          # an image whose tag disagrees with package.json.
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository owner to lowercase
        id: repo
        run: |
          echo "repository_owner_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/nightgate:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/nightgate:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image
        run: |
          docker pull ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/nightgate:${{ steps.version.outputs.version }}
          docker save ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/nightgate:${{ steps.version.outputs.version }} -o nightgate-${{ steps.version.outputs.version }}.tar
          gzip nightgate-${{ steps.version.outputs.version }}.tar

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: nightgate-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
